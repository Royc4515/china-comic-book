<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Roy's China Adventure — ספר קומיקס וירטואלי</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Heebo:wght@300;400;500;600;700;800;900&family=Bangers&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #06070a;
      --bg-surface: rgba(13, 16, 24, 0.92);
      --bg-surface-hover: rgba(22, 28, 42, 0.96);
      --border-color: rgba(255, 255, 255, 0.09);
      --accent-gold: #f59e0b;
      --accent-gold-glow: rgba(245, 158, 11, 0.35);
      --accent-amber: #d97706;
      --accent-cyan: #06b6d4;
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --glass-blur: blur(18px);
      --book-radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Heebo', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(6, 182, 212, 0.07) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(13, 16, 24, 0.8) 0%, #050608 100%);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ================= 1. FLOATING IMMERSIVE HEADER ================= */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 58px;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(6, 7, 10, 0.95) 0%, rgba(6, 7, 10, 0.7) 70%, transparent 100%);
      backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease;
    }

    header.hidden-hud {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent-gold), var(--accent-cyan));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 0 12px var(--accent-gold-glow);
    }

    .brand-info h1 {
      font-family: 'Cinzel', serif;
      font-size: 0.98rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-info h1 span {
      background: linear-gradient(135deg, var(--accent-gold), #fde047);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-info p {
      font-size: 0.72rem;
      color: var(--accent-cyan);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    /* Center Page Pill */
    .header-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .page-pill {
      font-family: 'Bangers', cursive;
      font-size: 1.15rem;
      color: var(--accent-gold);
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 2px 14px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.2);
    }

    /* Actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-icon-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      height: 36px;
      padding: 0 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .action-icon-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-review-link {
      background: rgba(6, 182, 212, 0.12);
      border-color: rgba(6, 182, 212, 0.3);
      color: var(--accent-cyan);
      text-decoration: none;
    }
    .btn-review-link:hover {
      background: rgba(6, 182, 212, 0.25);
      color: #fff;
    }

    /* ================= 2. MAIN VIRTUAL BOOK STAGE ================= */
    #reader-viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1800px;
      padding: 60px 10px 75px;
    }

    /* Ambient Glow Behind Book */
    .ambient-glow {
      position: absolute;
      width: 70vw;
      height: 70vh;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, rgba(6, 182, 212, 0.06) 50%, transparent 75%);
      filter: blur(50px);
      pointer-events: none;
      z-index: 1;
      transition: background 0.5s ease;
    }

    /* Realistic Virtual Book Shell */
    .book-shell {
      position: relative;
      height: 100%;
      max-height: 82vh;
      aspect-ratio: 1 / 1.414; /* Standard Comic Book A4-like aspect ratio */
      max-width: 95vw;
      border-radius: var(--book-radius);
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.85),
        0 8px 25px rgba(0, 0, 0, 0.6),
        0 0 25px rgba(245, 158, 11, 0.12);
      z-index: 10;
      background: #000;
      transform-style: preserve-3d;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Stacked Paper Edge Illusion */
    .book-shell::before {
      content: '';
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: -6px;
      width: 6px;
      background: repeating-linear-gradient(
        to bottom,
        #2a2d36,
        #2a2d36 1px,
        #15171e 1px,
        #15171e 3px
      );
      border-radius: 4px 0 0 4px;
      box-shadow: -2px 0 6px rgba(0, 0, 0, 0.7);
    }

    .book-shell::after {
      content: '';
      position: absolute;
      top: 4px;
      bottom: 4px;
      right: -6px;
      width: 6px;
      background: repeating-linear-gradient(
        to bottom,
        #2a2d36,
        #2a2d36 1px,
        #15171e 1px,
        #15171e 3px
      );
      border-radius: 0 4px 4px 0;
      box-shadow: 2px 0 6px rgba(0, 0, 0, 0.7);
    }

    /* Page Container */
    .book-page-wrap {
      width: 100%;
      height: 100%;
      border-radius: var(--book-radius);
      overflow: hidden;
      position: relative;
      background: #08090c;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: grab;
      touch-action: pan-y pinch-zoom;
    }
    .book-page-wrap:active { cursor: grabbing; }

    .book-page-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: transform 0.12s ease-out;
      transform-origin: center center;
    }

    /* 3D Realistic Page-Turn Shading Overlay */
    .page-turn-shadow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.6) 0%, rgba(255, 255, 255, 0.1) 40%, rgba(0, 0, 0, 0.7) 100%);
      transition: opacity 0.25s ease;
      border-radius: var(--book-radius);
    }

    /* Book Center Spine Crease */
    .spine-crease {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      width: 25px;
      background: linear-gradient(to left, rgba(0, 0, 0, 0.5) 0%, transparent 100%);
      pointer-events: none;
      z-index: 5;
    }

    /* Tap Zone Indicators for Mobile */
    .tap-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 30%;
      z-index: 25;
      cursor: pointer;
    }
    .tap-zone-prev { right: 0; }
    .tap-zone-next { left: 0; }
    .tap-zone-center { left: 30%; width: 40%; }

    /* Subtle touch ripples on tap */
    .tap-feedback {
      position: absolute;
      top: 50%;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.25);
      border: 1px solid var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.2rem;
      transform: translateY(-50%) scale(0);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s ease;
      z-index: 30;
    }
    .tap-feedback.show {
      transform: translateY(-50%) scale(1);
      opacity: 1;
    }
    .tap-feedback.left { left: 16px; }
    .tap-feedback.right { right: 16px; }

    /* ================= 3. FLOATING STORY DRAWER / SUMMARY CHIP ================= */
    .story-chip {
      position: fixed;
      bottom: 74px;
      background: rgba(13, 16, 24, 0.88);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-color);
      padding: 8px 18px;
      border-radius: 30px;
      max-width: 90vw;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      z-index: 80;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease;
    }

    .story-chip.hidden-hud {
      transform: translateY(120%);
      opacity: 0;
      pointer-events: none;
    }

    .story-chip-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .story-chip-loc {
      font-size: 0.74rem;
      color: var(--accent-cyan);
      white-space: nowrap;
    }

    .story-chip-arrow {
      color: var(--accent-gold);
      font-size: 0.8rem;
    }

    /* Modal Synopsis Bottom Sheet */
    .synopsis-modal {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10, 13, 20, 0.96);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px 20px 0 0;
      padding: 20px 24px 30px;
      z-index: 200;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
    }
    .synopsis-modal.active {
      transform: translateY(0);
    }

    .synopsis-handle {
      width: 44px;
      height: 4px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      margin: 0 auto 16px;
      cursor: pointer;
    }

    .synopsis-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .synopsis-head h3 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
    }

    .synopsis-close {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
    }

    .synopsis-body {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    /* ================= 4. FLOATING BOTTOM SCRUBBER HUD ================= */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: linear-gradient(0deg, rgba(6, 7, 10, 0.96) 0%, rgba(6, 7, 10, 0.75) 75%, transparent 100%);
      backdrop-filter: var(--glass-blur);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease;
    }

    footer.hidden-hud {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
    }

    .btn-step {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .btn-step:hover:not(:disabled) {
      background: var(--accent-gold);
      color: #000;
      border-color: var(--accent-gold);
      transform: scale(1.08);
    }
    .btn-step:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Scrubber Track */
    .scrubber-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }

    .scrubber-input {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      outline: none;
      cursor: pointer;
    }
    .scrubber-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent-gold);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.8);
      cursor: pointer;
      transition: transform 0.15s;
    }
    .scrubber-input::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }

    .scrubber-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Thumbnail Hover/Scrub Tooltip */
    .scrub-tooltip {
      position: absolute;
      bottom: 30px;
      transform: translateX(-50%);
      background: rgba(14, 18, 27, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid var(--accent-gold);
      border-radius: 8px;
      padding: 6px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      z-index: 120;
    }
    .scrub-tooltip.show { display: flex; }
    .scrub-tooltip img {
      width: 60px;
      height: 80px;
      object-fit: cover;
      border-radius: 4px;
    }
    .scrub-tooltip span {
      font-size: 0.7rem;
      font-weight: 700;
      color: #fff;
    }

    /* ================= 5. TABLE OF CONTENTS DRAWER ================= */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-content {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 320px;
      max-width: 85vw;
      background: rgba(12, 15, 22, 0.98);
      backdrop-filter: blur(24px);
      border-left: 1px solid var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 310;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: -15px 0 40px rgba(0, 0, 0, 0.8);
    }
    .drawer-overlay.active .drawer-content {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .drawer-header h2 {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
    }

    .drawer-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
    }
    .drawer-list::-webkit-scrollbar { width: 4px; }
    .drawer-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }

    .drawer-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .drawer-item:hover, .drawer-item.active {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.35);
    }
    .drawer-item.active {
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.25);
    }

    .drawer-thumb {
      width: 44px;
      height: 58px;
      border-radius: 4px;
      object-fit: cover;
      background: #000;
      flex-shrink: 0;
    }

    .drawer-item-info {
      flex: 1;
      min-width: 0;
    }
    .drawer-item-num {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--accent-gold);
    }
    .drawer-item-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .drawer-item-loc {
      font-size: 0.7rem;
      color: var(--accent-cyan);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ================= 6. WEBTOON / VERTICAL CONTINUOUS SCROLL MODE ================= */
    #vertical-scroll-view {
      display: none;
      flex: 1;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 68px 10px 80px;
    }

    .vertical-scroll-container {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .v-page-card {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .v-page-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    .v-page-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--accent-gold);
      font-family: 'Bangers', cursive;
      font-size: 1rem;
      padding: 2px 10px;
      border-radius: 6px;
    }

    /* Double Tap Zoom Hint */
    .zoom-hint-banner {
      position: absolute;
      top: 68px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      font-size: 0.75rem;
      padding: 4px 14px;
      border-radius: 20px;
      pointer-events: none;
      z-index: 50;
      opacity: 0;
      transform: translateY(-8px);
      transition: all 0.3s ease;
    }
    .zoom-hint-banner.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- ================= FLOATING MASTER HEADER ================= -->
  <header id="main-header">
    <div class="brand-group">
      <div class="brand-logo">📖</div>
      <div class="brand-info">
        <h1>Roy's China <span>Comic</span></h1>
        <p id="header-loc">Beijing Atmosphere Bar</p>
      </div>
    </div>

    <div class="header-center">
      <span class="page-pill" id="header-page-pill">P. 01 / 12</span>
    </div>

    <div class="header-actions">
      <button class="action-icon-btn" id="btn-mode-toggle" onclick="toggleReadMode()" title="החלף בין דפדוף לגלילה">
        📜 גלילה
      </button>

      <button class="action-icon-btn" id="btn-sound-toggle" onclick="toggleSound()" title="צלילי דפדוף">
        🔊
      </button>

      <button class="action-icon-btn" onclick="openDrawer()" title="תוכן עניינים">
        📑
      </button>

      <a href="review.html" class="action-icon-btn btn-review-link" title="החלף גרסאות דפים">
        ⚔️ בחירת גרסאות
      </a>
    </div>
  </header>

  <!-- ================= DOUBLE TAP ZOOM HINT BANNER ================= -->
  <div class="zoom-hint-banner" id="zoom-hint">💡 הקשה כפולה (Double Tap) או צביטה להגדלה</div>

  <!-- ================= 1. VIRTUAL BOOK FLIP MODE ================= -->
  <main id="reader-viewport">
    <div class="ambient-glow" id="ambient-glow"></div>

    <div class="book-shell" id="book-shell">
      <div class="book-page-wrap" id="page-wrap">

        src: "assets/page_12.png"

    let currentPage = 0; // Starts on Cover Page!
    let readMode = 'book'; // 'book' | 'scroll'
    let hudVisible = true;
    let soundEnabled = true;

    // Realistic Web Audio Synthesis for Page Turn & Paper Rustle
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function playPaperTurnSound() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioCtx();
        if (ctx.state === 'suspended') ctx.resume();
        const now = ctx.currentTime;

        // 1. Noise buffer for realistic paper texture rustle
        const bufferSize = ctx.sampleRate * 0.15;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1200, now);
        filter.frequency.exponentialRampToValueAtTime(300, now + 0.15);
        filter.Q.value = 1.2;

        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.09, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(ctx.destination);
        noise.start(now);

        // 2. Low-frequency page swoop
        const osc = ctx.createOscillator();
        const oscGain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.18);
        oscGain.gain.setValueAtTime(0.12, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

        osc.connect(oscGain);
        oscGain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('btn-sound-toggle');
      btn.innerText = soundEnabled ? '🔊' : '🔇';
    }

    // Cycle through cover variants dynamically
    function switchCoverVariant() {
      currentCoverIdx = (currentCoverIdx + 1) % coverVariants.length;
      playPaperTurnSound();
      updateBookPage('next');
    }

    // ================= PAGE RENDERING & UPDATES =================
    function updateBookPage(animateDirection = null) {
      const data = comicPages.find(p => p.num === currentPage) || comicPages[0];
      const img = document.getElementById('page-img');
      const shell = document.getElementById('book-shell');
      const shadow = document.getElementById('turn-shadow');

      // Update text HUD elements
      if (data.isCover) {
        document.getElementById('header-page-pill').innerText = `COVER • ${coverVariants[currentCoverIdx].tag}`;
        document.getElementById('header-loc').innerText = coverVariants[currentCoverIdx].title;
        document.getElementById('chip-title').innerText = `${data.title} [${coverVariants[currentCoverIdx].tag}]`;
        document.getElementById('chip-loc').innerText = `🎲 לחץ להחלפת שער אקראי (1 מתוך 3)`;
      } else {
        const pageStr = String(currentPage).padStart(2, '0');
        document.getElementById('header-page-pill').innerText = `P. ${pageStr} / 12`;
        document.getElementById('header-loc').innerText = data.loc;
        document.getElementById('chip-title').innerText = data.title;
        document.getElementById('chip-loc').innerText = `📍 ${data.loc}`;
      }

      document.getElementById('modal-synopsis-title').innerText = data.title;
      document.getElementById('modal-synopsis-text').innerText = data.synopsis;

      // Update Scrubber
      const scrubber = document.getElementById('scrubber');
      scrubber.min = 0;
      scrubber.max = 12;
      scrubber.value = currentPage;
      const pct = Math.round((currentPage / 12) * 100);
      document.getElementById('scrub-curr-page').innerText = data.isCover ? `עמוד שער (${coverVariants[currentCoverIdx].tag})` : `עמוד ${currentPage} מתוך 12`;
      document.getElementById('scrub-pct').innerText = `${pct}% הושלמו`;

      // Update Steppers
      document.getElementById('btn-prev').disabled = currentPage === 0;
      document.getElementById('btn-next').disabled = currentPage === 12;

      // Reset Zoom on page change
      resetTouchZoom();

      // Realistic 3D Page Turn Animation
      if (animateDirection) {
        shadow.style.opacity = '0.7';
        const rotateY = animateDirection === 'next' ? -18 : 18;
        shell.style.transform = `rotateY(${rotateY}deg) scale(0.96)`;

        setTimeout(() => {
          img.src = data.src;
          shell.style.transform = `rotateY(${-rotateY * 0.3}deg) scale(1.02)`;
          shadow.style.opacity = '0.2';
          setTimeout(() => {
            shell.style.transform = 'rotateY(0deg) scale(1)';
            shadow.style.opacity = '0';
          }, 140);
        }, 120);
      } else {
        img.src = data.src;
      }

      // Update drawer active highlight
      document.querySelectorAll('.drawer-item').forEach((item, idx) => {
        item.classList.toggle('active', comicPages[idx] && comicPages[idx].num === currentPage);
      });
    }

    function nextPage() {
      if (currentPage < 12) {
        currentPage++;
        playPaperTurnSound();
        triggerTapVisual('left');
        updateBookPage('next');
      }
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage--;
        playPaperTurnSound();
        triggerTapVisual('right');
        updateBookPage('prev');

    }

    function goToPage(n) {
      if (n >= 0 && n <= 12 && n !== currentPage) {
        const dir = n > currentPage ? 'next' : 'prev';
        currentPage = n;
        playPaperTurnSound();
        updateBookPage(dir);
      }
    }

      // Update drawer active highlight
      document.querySelectorAll('.drawer-item').forEach((item, idx) => {

    function nextPage() {
      if (currentPage < 12) {
        currentPage++;
        playPaperTurnSound();
        triggerTapVisual('left');
        updateBookPage('next');

    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        playPaperTurnSound();
        triggerTapVisual('right');
        updateBookPage('prev');
      }
    }

    function goToPage(n) {
      if (n >= 1 && n <= 12 && n !== currentPage) {
        const dir = n > currentPage ? 'next' : 'prev';
        currentPage = n;
        playPaperTurnSound();
        updateBookPage(dir);

    function triggerTapVisual(side) {
      const el = document.getElementById(side === 'left' ? 'tap-left' : 'tap-right');
      if (el) {
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 220);

    // Handle Tap Zones on Book (RTL: right side is previous, left side is next, center toggles HUD)
    function handleTapZone(zone) {
      if (isZoomed) {
        // If zoomed in, tap doesn't turn page
        return;
      }
      if (zone === 'next') {
        nextPage();
      } else if (zone === 'prev') {
        prevPage();
      } else if (zone === 'center') {
        toggleHUD();
      }
    }

    // Toggle HUD for Pure Immersive Fullscreen Reading
    function toggleHUD() {
      hudVisible = !hudVisible;
      document.getElementById('main-header').classList.toggle('hidden-hud', !hudVisible);
      document.getElementById('main-footer').classList.toggle('hidden-hud', !hudVisible);
      document.getElementById('story-chip').classList.toggle('hidden-hud', !hudVisible);
    }

    // ================= TOUCH SWIPE & PINCH ZOOM =================
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;
    let isSwiping = false;

    // Zoom & Pan State
    let zoomScale = 1;
    let panX = 0;
    let panY = 0;
    let isPanning = false;
    let panStartX = 0;
    let panStartY = 0;
    let isZoomed = false;
    let lastTapTime = 0;
    let initialPinchDist = null;
    let pinchStartZoom = 1;

    const pageWrap = document.getElementById('page-wrap');
    const pageImg = document.getElementById('page-img');

    pageWrap.addEventListener('touchstart', (e) => {
      const now = Date.now();

      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartTime = now;
        isSwiping = true;

        // Double-tap detection for Instant Zoom
        if (now - lastTapTime < 300) {
          e.preventDefault();
          toggleDoubleTapZoom(e.touches[0]);
          isSwiping = false;
        }
        lastTapTime = now;

        if (isZoomed) {
          isPanning = true;
          panStartX = e.touches[0].clientX - panX;
          panStartY = e.touches[0].clientY - panY;
        }
      } else if (e.touches.length === 2) {
        // Pinch-to-zoom
        isSwiping = false;
        isPanning = false;
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        pinchStartZoom = zoomScale;
      }
    }, { passive: false });

    pageWrap.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isZoomed && isPanning) {
        e.preventDefault();
        panX = e.touches[0].clientX - panStartX;
        panY = e.touches[0].clientY - panStartY;
        applyPageTransform();
      } else if (e.touches.length === 2 && initialPinchDist) {
        e.preventDefault();
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        zoomScale = Math.min(Math.max((dist / initialPinchDist) * pinchStartZoom, 1), 4);
        isZoomed = zoomScale > 1.05;
        applyPageTransform();
      }
    }, { passive: false });

    pageWrap.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        isPanning = false;
        initialPinchDist = null;

        // If swipe gesture completed (not zoomed)
        if (isSwiping && !isZoomed) {
          const deltaX = e.changedTouches[0].clientX - touchStartX;
          const deltaY = e.changedTouches[0].clientY - touchStartY;
          const deltaTime = Date.now() - touchStartTime;

          // Horizontal swipe detection (min 45px distance and faster than 500ms)
          if (Math.abs(deltaX) > 45 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5 && deltaTime < 550) {
            if (deltaX > 0) {
              // Swiped right -> Previous page in RTL
              prevPage();
            } else {
              // Swiped left -> Next page in RTL
              nextPage();
            }
          }
        }
        isSwiping = false;
      }
    });

    function toggleDoubleTapZoom(touch) {
      if (isZoomed) {
        resetTouchZoom();
      } else {
        zoomScale = 2.4;
        isZoomed = true;
        // Center zoom around the tap coordinate
        const rect = pageWrap.getBoundingClientRect();
        const tapX = touch.clientX - rect.left - rect.width / 2;
        const tapY = touch.clientY - rect.top - rect.height / 2;
        panX = -tapX * 0.8;
        panY = -tapY * 0.8;
        applyPageTransform();
      }
    }

    function resetTouchZoom() {
      zoomScale = 1;
      panX = 0;
      panY = 0;
      isZoomed = false;
      applyPageTransform();
    }

    function applyPageTransform() {
      pageImg.style.transform = `scale(${zoomScale}) translate(${panX / zoomScale}px, ${panY / zoomScale}px)`;
    }

    // ================= READ MODE TOGGLE (BOOK FLIP vs WEBTOON SCROLL) =================
    function toggleReadMode() {
      const bookView = document.getElementById('reader-viewport');
      const scrollView = document.getElementById('vertical-scroll-view');
      const btn = document.getElementById('btn-mode-toggle');

      if (readMode === 'book') {
        readMode = 'scroll';
        bookView.style.display = 'none';
        scrollView.style.display = 'block';
        btn.innerText = '📖 דפדוף';
        buildVerticalScroll();
        // Scroll to current page
        setTimeout(() => {
          const card = document.getElementById(`v-page-${currentPage}`);
          if (card) card.scrollIntoView({ behavior: 'smooth' });
        }, 100);
      } else {
        readMode = 'book';
        bookView.style.display = 'flex';
        scrollView.style.display = 'none';
        btn.innerText = '📜 גלילה';
        updateBookPage();
      }
    }

    function buildVerticalScroll() {
      const container = document.getElementById('vertical-container');
      container.innerHTML = '';

      comicPages.forEach(p => {
        const card = document.createElement('div');
        card.className = 'v-page-card';
        card.id = `v-page-${p.num}`;
        card.innerHTML = `
          <span class="v-page-badge">PAGE ${String(p.num).padStart(2, '0')}</span>
          <img src="${p.src}" alt="${p.title}" loading="lazy">
        `;
        container.appendChild(card);
      });
    }

    // ================= SCRUBBER INTERACTION =================
    function handleScrubInput(val) {
      const num = parseInt(val, 10);
      const data = comicPages.find(p => p.num === num) || comicPages[0];
      const tooltip = document.getElementById('scrub-tooltip');
      const tooltipImg = document.getElementById('scrub-tooltip-img');
      const tooltipText = document.getElementById('scrub-tooltip-text');

      tooltipImg.src = data.src;
      if (data.isCover) {
        tooltipText.innerText = `עמוד שער (${coverVariants[currentCoverIdx].tag})`;
      } else {
        tooltipText.innerText = `עמוד ${num}: ${data.title.split(':')[1] || ''}`;
      }

      // Position tooltip above thumb
      const scrubber = document.getElementById('scrubber');
      const pct = num / 12;
      const rect = scrubber.getBoundingClientRect();
      const leftPos = rect.left + (rect.width * pct);
      tooltip.style.left = `${leftPos}px`;
      tooltip.classList.add('show');
    }

    function handleScrubChange(val) {
      document.getElementById('scrub-tooltip').classList.remove('show');
      goToPage(parseInt(val, 10));
    }

    // ================= DRAWER / TABLE OF CONTENTS =================
    function buildDrawer() {
      const list = document.getElementById('drawer-list');
      list.innerHTML = '';

      comicPages.forEach(p => {
        const item = document.createElement('div');
        item.className = `drawer-item ${p.num === currentPage ? 'active' : ''}`;
        item.onclick = () => {
          goToPage(p.num);
          closeDrawer();
        };

        const badgeText = p.isCover ? `COVER • ${coverVariants[currentCoverIdx].tag}` : `PAGE ${String(p.num).padStart(2, '0')}`;

        item.innerHTML = `
          <img class="drawer-thumb" src="${p.src}" alt="Thumb ${p.num}">
          <div class="drawer-item-info">
            <div class="drawer-item-num">${badgeText}</div>
            <div class="drawer-item-title">${p.title}</div>
            <div class="drawer-item-loc">📍 ${p.loc}</div>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function openDrawer() {
      buildDrawer();
      document.getElementById('drawer-overlay').classList.add('active');
    }

    function closeDrawer(e) {
      if (e && e.target && e.target.id !== 'drawer-overlay' && !e.target.classList.contains('synopsis-close')) return;
      document.getElementById('drawer-overlay').classList.remove('active');
    }

    // ================= SYNOPSIS MODAL =================
    function openSynopsis() {
      const data = comicPages.find(p => p.num === currentPage) || comicPages[0];
      if (data.isCover) {
        switchCoverVariant();
      } else {
        document.getElementById('synopsis-modal').classList.add('active');
      }
    }

    function closeSynopsis() {
      document.getElementById('synopsis-modal').classList.remove('active');
    }

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key.toLowerCase() === 'd') {
        prevPage(); // RTL convention
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key.toLowerCase() === 'a') {
        nextPage();
      } else if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else if (document.exitFullscreen) document.exitFullscreen();
      } else if (e.key === 'Escape') {
        closeDrawer();
        closeSynopsis();
        resetTouchZoom();
      }
    });

    // Show initial double-tap zoom hint briefly
    setTimeout(() => {
      const hint = document.getElementById('zoom-hint');
      hint.classList.add('show');
      setTimeout(() => hint.classList.remove('show'), 3500);
    }, 1200);

    // Initial render
    updateBookPage();
  </script>
</body>
</html>
